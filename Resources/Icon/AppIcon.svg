<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hermes Island app icon. Original mark: a warm tile with a floating black island that holds a live voice wave. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC45E"/><stop offset="1" stop-color="#EF5F28"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22232A"/><stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27E"/><stop offset="1" stop-color="#FFA23E"/>
    </linearGradient>
    <filter id="tile" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/></filter>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#8A2E00" flood-opacity="0.5"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tile)"/>
  <path d="M100 286 A186 186 0 0 1 286 100 H738 A186 186 0 0 1 924 286 V420 Q512 360 100 420 Z" fill="#fff" opacity="0.08"/>
  <rect x="172" y="388" width="680" height="248" rx="124" fill="url(#pill)" filter="url(#lift)"/>
  <rect x="176" y="392" width="672" height="240" rx="120" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="4"/>
  <circle cx="300" cy="512" r="50" fill="#7EE2A8"/>
  <g fill="url(#wave)">
    <rect x="420" y="466" width="48" height="92" rx="24"/>
    <rect x="500" y="420" width="48" height="184" rx="24"/>
    <rect x="580" y="446" width="48" height="132" rx="24"/>
    <rect x="660" y="476" width="48" height="72" rx="24"/>
    <rect x="740" y="490" width="44" height="44" rx="22" opacity="0.55"/>
  </g>
</svg>
